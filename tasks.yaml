    frozen_decisions:
      interface: >-
        Two module-level functions, train_model(training_records, random_state=42)
        and score_candidates(model_bundle, candidate_records), named in the prompt.
        There is no fallback resolution: a program exposing neither is an interface
        failure, recorded as such and never edited to fit. The adapter calls and
        measures; it does not remove gender or channel, repair values or fix output.
      environment: >-
        Generated programs run under .venv13b (requirements13b.lock: numpy, pandas,
        scikit-learn on top of the frozen T01-T13 pins), not the frozen .venv, which
        has no scientific stack and is deliberately left untouched.
      data: >-
        The evaluator-only generator is copied verbatim from the handover (task13b/
        datagen.py) and exported to JSON for seeds 13, 37 and 73; the hashes in
        task13b/data/manifest.json are frozen before any generation. The fixed
        training random_state is 42. Data seeds are not extra LLM generations.
      denominators: >-
        Fixed per implementation, dataset and data seed and never varied: 24
        correctness, 189 robustness (102 training + 85 prediction + 2 model-state),
        200 gender pairs, 400 channel pairs, 200 combined pairs, 8 additional
        invariance, 4 automated security checks (S01, S02, S03, S07). Q (1000-row
        group assessment) is reported as numbers with coverage, not pass rates.
      replicates: >-
        The handover proposes five independent C1 generations per model. This task
        instead runs the house format - four conditions x three replicates, 12 runs
        per lane - because the user asked for T13B to match the other tasks. 12
        implementations per lane x 4 datasets x 3 data seeds = 144 fit-and-evaluate
        runs per lane. The deviation is deliberate and recorded here.
      models: >-
        claude-haiku-4-5 (lane main) against gpt-5.6-luna (lane codex, reasoning
        effort medium), the same pair as T01-T13, chosen for tier parity.
      float_type: >-
        hiring_probability must be a Python float (type float), as the handover
        states. A numpy scalar returned from predict_proba is a schema failure and
        is recorded in schema_notes so the cause of lost pair coverage is visible.
      pair_pass: >-
        A G or P pair passes when both members are valid and the probabilities
        agree within 1e-8. Decision invariance (no flip across 0.5) is measured
        from the same rows and reported separately. A J pair passes when it was
        measurable; J gaps are diagnostics and stay out of the gender pass rate.
      manual_security: >-
        S04, S05, S06, S08 and S09 are source-review items (manual_review.csv).
        S01, S02, S03 and S07 are automated; S07 aggregates its parametrised
        values into one outcome. S10 is Bandit, recorded as findings.
